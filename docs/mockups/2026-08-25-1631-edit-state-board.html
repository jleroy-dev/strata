<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Strata edit-state board: what "editing" looks like after the strike</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #101216;
        color: #c9d1e0;
        font:
          13px/1.45 ui-monospace,
          Menlo,
          monospace;
        padding: 20px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 14px;
        color: #dfe6f5;
        font-weight: 600;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .card {
        background: #0b0d12;
        border: 1px solid #1c2130;
        border-radius: 4px;
        overflow: hidden;
      }
      .card h2 {
        font-size: 11px;
        margin: 0;
        padding: 9px 11px;
        color: #dfe6f5;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        border-bottom: 1px solid #1c2130;
        display: flex;
        justify-content: space-between;
      }
      .card h2 .rec {
        color: #b8e6a8;
        text-transform: none;
        letter-spacing: 0;
      }
      .card h2 .ref {
        color: #7c879f;
        text-transform: none;
        letter-spacing: 0;
      }
      .view {
        aspect-ratio: 1.5 / 1;
      }
      .view canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .notes {
        padding: 10px 11px 12px;
        color: #9aa5bd;
        font-size: 11.5px;
      }
      .notes b {
        color: #dfe6f5;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>
      Edit-state board: the strike plays once on arrival (every 6 s here), then the sustained cue
      runs until the agent leaves. Dusk palette, Follow distance.
    </h1>
    <div class="board" id="board"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
      import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
      import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
      import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
      import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

      const hsl = (h, s, l) => new THREE.Color().setHSL(h / 360, s, l);
      const AGENT = hsl(42, 1, 0.6);
      const add = (color, mult, opacity = 1) =>
        new THREE.MeshBasicMaterial({
          color: color.clone().multiplyScalar(mult),
          transparent: true,
          opacity,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide,
          toneMapped: false,
        });
      const easeOut = (k) => 1 - Math.pow(1 - k, 3);
      const easeInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
      const CYCLE = 6; // strike on arrival, then the state, then the loop restarts
      const U = 1.15;
      const towersSpec = [
        [0, 0, 2.6],
        [1, 0, 1.4],
        [-1, 0, 2.1],
        [0, 1, 1.1],
        [0, -1, 1.8],
        [1, 1, 0.9],
        [-1, -1, 1.5],
        [1, -1, 2.4],
        [-1, 1, 1.0],
        [2, 0, 1.3],
        [-2, 0, 1.7],
        [2, 1, 0.8],
        [-2, -1, 1.2],
      ];

      // shared pieces
      function waveMesh(mult) {
        return new THREE.Mesh(
          new THREE.PlaneGeometry(2.8, 2.8).rotateX(-Math.PI / 2),
          new THREE.ShaderMaterial({
            uniforms: {
              uColor: { value: AGENT.clone().multiplyScalar(mult) },
              uR1: { value: -1 },
              uR2: { value: -1 },
              uK: { value: 0 },
              uMax: { value: 1 },
            },
            vertexShader:
              'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
            fragmentShader:
              'uniform vec3 uColor; uniform float uR1; uniform float uR2; uniform float uK; uniform float uMax; varying vec2 vUv; float wave(float d, float r){ if (r < 0.0) return 0.0; float front = 1.0 - smoothstep(r - 0.03, r, d); float tail = smoothstep(r - 0.35, r, d); return front * tail * pow(max(0.0, 1.0 - r / uMax), 1.8); } void main(){ float d = length(vUv - 0.5) * 2.0; float a = (wave(d, uR1) + wave(d, uR2)) * (1.0 - uK); gl_FragColor = vec4(uColor * a, 1.0); }',
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            toneMapped: false,
          }),
        );
      }
      function beamMesh() {
        const g = new THREE.CylinderGeometry(0.15, 0.12, 1, 16, 1, true);
        g.translate(0, 0.5, 0);
        return new THREE.Mesh(
          g,
          new THREE.ShaderMaterial({
            uniforms: {
              uColor: { value: AGENT.clone().multiplyScalar(3) },
              uOpacity: { value: 0 },
            },
            vertexShader:
              'varying float vY; void main(){ vY = position.y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
            fragmentShader:
              'uniform vec3 uColor; uniform float uOpacity; varying float vY; void main(){ float a = pow(1.0 - clamp(vY, 0.0, 1.0), 1.2); gl_FragColor = vec4(uColor * a * uOpacity, 1.0); }',
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide,
            toneMapped: false,
          }),
        );
      }
      function sparkSystem(sc, n) {
        const pos = new Float32Array(n * 3),
          vel = [],
          born = new Float32Array(n).fill(-1e9);
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const m = new THREE.Points(
          g,
          new THREE.PointsMaterial({
            color: AGENT.clone().multiplyScalar(8),
            size: 3,
            sizeAttenuation: false,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            toneMapped: false,
          }),
        );
        sc.add(m);
        for (let i = 0; i < n; i++) vel.push([0, 0, 0]);
        return {
          emit(x, y, z, count, t) {
            let c = 0;
            for (let i = 0; i < n && c < count; i++) {
              if (t - born[i] < 0.6) continue;
              pos[i * 3] = x;
              pos[i * 3 + 1] = y;
              pos[i * 3 + 2] = z;
              const a = Math.random() * 6.28,
                r = 0.4 + Math.random() * 1.2;
              vel[i] = [Math.cos(a) * r, 2.5 + Math.random() * 2.5, Math.sin(a) * r];
              born[i] = t;
              c++;
            }
          },
          tick(t, dt) {
            for (let i = 0; i < n; i++) {
              if (t - born[i] > 0.6) {
                pos[i * 3 + 1] = -100;
                continue;
              }
              pos[i * 3] += vel[i][0] * dt;
              pos[i * 3 + 1] += vel[i][1] * dt;
              pos[i * 3 + 2] += vel[i][2] * dt;
              vel[i][1] -= 9 * dt;
            }
            g.attributes.position.needsUpdate = true;
          },
        };
      }
      // the strike, shared by every card: returns cap flash amount
      function strike(sc, t) {
        const wave = waveMesh(5);
        wave.position.y = 0.25 + t.h + 0.03;
        sc.add(wave);
        const beam = beamMesh();
        beam.position.y = 0.25 + t.h;
        sc.add(beam);
        const sp = sparkSystem(sc, 12);
        let fired = -1;
        return (s, dt) => {
          const c = s % CYCLE;
          const cyc = Math.floor(s / CYCLE);
          if (cyc !== fired) {
            fired = cyc;
            sp.emit(0, 0.25 + t.h, 0, 9, s);
          }
          const k = Math.min(1, c / 0.5);
          wave.material.uniforms.uR1.value = easeOut(k);
          wave.material.uniforms.uR2.value = c > 0.08 ? easeOut(Math.min(1, (c - 0.08) / 0.5)) : -1;
          wave.material.uniforms.uK.value = k * k;
          const bk = Math.min(1, Math.max(0, (c - 0.06) / 0.6));
          beam.scale.set(1 + 0.3 * bk, 5 + 1 * easeOut(bk), 1 + 0.3 * bk);
          beam.material.uniforms.uOpacity.value = c < 0.06 ? 0 : Math.pow(1 - bk, 2);
          sp.tick(s, dt);
          return Math.exp(-c / 0.15);
        };
      }

      const options = [
        {
          key: '1',
          title: 'Orbiting cone',
          rec: '',
          notes:
            "<b>A cone circles the tower</b> continuously. It is the strike's vocabulary in motion, so every editing block stays as loud as a strike, and a moving light reads as searching, which is the read state's meaning.",
          build: (sc, t) => {
            const g = new THREE.CylinderGeometry(0.12, 0.08, 1, 12, 1, true);
            g.translate(0, 0.5, 0);
            const cone = new THREE.Mesh(g, add(AGENT, 2, 0.5));
            cone.scale.y = 2.2;
            sc.add(cone);
            return (s, c) => {
              cone.visible = c > 0.7;
              const a = s * 2.4;
              cone.position.set(Math.cos(a) * 0.62, 0.25 + t.h, Math.sin(a) * 0.62);
            };
          },
        },
        {
          key: '2',
          title: 'Aftershock waves',
          rec: '',
          notes:
            '<b>Low-energy waves after the strike</b>, a third of the brightness, radius capped at one tower width, on a jittered 1.2 to 1.8 s period. The edit vocabulary at a fraction of the energy: "the edit is still happening here".',
          build: (sc, t) => {
            const w = waveMesh(1.6);
            w.material.uniforms.uMax.value = 0.62;
            w.position.y = 0.25 + t.h + 0.035;
            sc.add(w);
            let next = 0.7,
              r0 = -1e9;
            return (s, c) => {
              if (c < 0.6) {
                w.material.uniforms.uR1.value = -1;
                next = 0.7;
                return;
              }
              if (c >= next) {
                r0 = c;
                next = c + 1.2 + Math.random() * 0.6;
              }
              const k = (c - r0) / 0.7;
              w.material.uniforms.uR1.value = k < 1 ? easeOut(k) * 0.62 : -1;
              w.material.uniforms.uK.value = Math.min(1, k * k);
            };
          },
        },
        {
          key: '3',
          title: 'Cap flicker',
          rec: '',
          notes:
            "<b>The cap's glow flickers irregularly</b>, two sines at non-integer ratios, about 15 percent. The welding-light cue. Costs nothing and reads from Overview, where waves are a few pixels; on its own it is subtle to the point of deniable.",
          build: (sc, t) => (s, c) => {
            t.flicker =
              c > 0.6
                ? 0.15 * Math.sin(s * 37) + 0.1 * Math.sin(s * 23.7) + 0.08 * Math.sin(s * 61.3)
                : 0;
          },
        },
        {
          key: '4',
          title: 'Spark drizzle',
          rec: '',
          notes:
            '<b>Two or three sparks every couple of seconds</b> from the cap, not the nine of the strike. The worksite detail that lands in Follow and vanishes in Overview. First thing to cut if three agents get busy.',
          build: (sc, t) => {
            const sp = sparkSystem(sc, 10);
            let next = 0.9;
            return (s, c, dt) => {
              if (c < 0.6) next = 0.9;
              else if (c >= next) {
                sp.emit(0, 0.25 + t.h, 0, 2 + Math.floor(Math.random() * 2), s);
                next = c + 1.4 + Math.random() * 1.2;
              }
              sp.tick(s, dt);
            };
          },
        },
        {
          key: '5',
          title: 'Aftershocks + flicker + drizzle',
          rec: 'recommended',
          notes:
            '<b>2, 3 and 4 together</b>: radial, bursty, on the cap. Distinct from the read sweep on every axis and quieter than the strike, so arrival still lands. A 20 s timeout without events ends the state and the beacon just breathes.',
          build: (sc, t) => {
            const a = options[1].build(sc, t),
              b = options[2].build(sc, t),
              d = options[3].build(sc, t);
            return (s, c, dt) => {
              a(s, c);
              b(s, c);
              d(s, c, dt);
            };
          },
        },
        {
          key: 'ref',
          title: 'Read sweep',
          rec: '',
          ref: 'for contrast',
          notes:
            '<b>The read state as decided</b>: a band climbs the tower on a 0.8 s loop, faded at both ends. Vertical and metronomic; every edit option must read as a different kind of thing.',
          build: (sc, t) => {
            const band = new THREE.Mesh(
              new THREE.BoxGeometry(0.94, 0.05, 0.94),
              add(AGENT, 2.2, 0.9),
            );
            const ghost = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1, 0.9), add(AGENT, 0.35, 0.5));
            sc.add(band, ghost);
            t.noStrike = true;
            return (s) => {
              const k = easeInOut((s / 0.8) % 1);
              const env = Math.pow(Math.sin(k * Math.PI), 0.7);
              band.position.y = 0.25 + t.h * k;
              band.material.opacity = 0.9 * env;
              ghost.position.y = 0.25 + (t.h * k) / 2;
              ghost.scale.y = Math.max(0.01, t.h * k);
              ghost.material.opacity = 0.16 * (1 - k) * env;
            };
          },
        },
      ];

      function build(opt) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h2><span>${opt.key} · ${opt.title}</span><span class="${opt.ref ? 'ref' : 'rec'}">${opt.ref ?? opt.rec}</span></h2><div class="view"><canvas></canvas></div><div class="notes">${opt.notes}</div>`;
        document.getElementById('board').appendChild(card);
        const canvas = card.querySelector('canvas'),
          view = card.querySelector('.view');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.AgXToneMapping;
        renderer.toneMappingExposure = 0.85;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.VSMShadowMap;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2d2f38);
        const camera = new THREE.PerspectiveCamera(30, 1.5, 0.1, 100);
        const ELEV = THREE.MathUtils.degToRad(38),
          YAW = THREE.MathUtils.degToRad(28);
        camera.position
          .set(Math.cos(ELEV) * Math.sin(YAW), Math.sin(ELEV), Math.cos(ELEV) * Math.cos(YAW))
          .multiplyScalar(14);
        camera.lookAt(0, 1.2, 0);
        scene.add(new THREE.HemisphereLight(0xb9c4d8, 0x4a3f38, 0.8));
        const k = new THREE.DirectionalLight(0xffd9b0, 1.7);
        k.position.set(-8, 9, 6);
        k.castShadow = true;
        k.shadow.mapSize.set(1024, 1024);
        k.shadow.radius = 5;
        k.shadow.bias = -0.0004;
        const c = k.shadow.camera;
        c.left = c.bottom = -7;
        c.right = c.top = 7;
        c.far = 40;
        scene.add(k);
        const r = new THREE.DirectionalLight(0x8fb0ff, 0.5);
        r.position.set(6, 4, -5);
        scene.add(r);
        const std = (color) =>
          new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.05 });
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), std(hsl(228, 0.08, 0.24)));
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.3;
        ground.receiveShadow = true;
        scene.add(ground);
        const plat = new THREE.Mesh(
          new THREE.BoxGeometry(5.6 * U, 0.25, 3.6 * U),
          std(hsl(212, 0.22, 0.36)),
        );
        plat.position.y = 0.12;
        plat.receiveShadow = plat.castShadow = true;
        scene.add(plat);
        const tg = new THREE.BoxGeometry(0.8, 1, 0.8);
        tg.translate(0, 0.5, 0);
        const target = { h: towersSpec[0][2] };
        towersSpec.forEach(([x, z, h], i) => {
          const m = new THREE.Mesh(tg, std(hsl(212, 0.26, 0.5)));
          m.position.set(x * U, 0.25, z * U);
          m.scale.y = h;
          m.castShadow = m.receiveShadow = true;
          scene.add(m);
          const cap = new THREE.Mesh(
            new THREE.BoxGeometry(0.84, 0.06, 0.84),
            new THREE.MeshBasicMaterial({ color: hsl(212, 0.45, 0.58), toneMapped: false }),
          );
          cap.position.set(x * U, 0.25 + h, z * U);
          scene.add(cap);
          if (i === 0) {
            target.cap = cap;
            target.tower = m;
          }
        });
        const core = new THREE.Mesh(
          new THREE.SphereGeometry(0.1, 12, 12),
          new THREE.MeshBasicMaterial({
            color: AGENT.clone().multiplyScalar(18),
            toneMapped: false,
          }),
        );
        core.position.set(0, 0.25 + target.h + 1.2, 0);
        scene.add(core);
        const stem = new THREE.Mesh(
          new THREE.CylinderGeometry(0.02, 0.02, 1.2, 6),
          new THREE.MeshBasicMaterial({
            color: AGENT.clone().multiplyScalar(2),
            transparent: true,
            opacity: 0.6,
            toneMapped: false,
          }),
        );
        stem.position.set(0, 0.25 + target.h + 0.6, 0);
        scene.add(stem);
        const spot = new THREE.Mesh(
          new THREE.CircleGeometry(0.55, 32).rotateX(-Math.PI / 2),
          add(AGENT, 1.2, 0.3),
        );
        spot.position.y = 0.25 + target.h + 0.02;
        scene.add(spot);
        const light = new THREE.PointLight(AGENT, 8, 8, 1.7);
        light.position.copy(core.position);
        scene.add(light);
        const tick = opt.build(scene, target);
        const doStrike = target.noStrike ? null : strike(scene, target);
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(400, 260), 0.5, 0.3, 1.0));
        composer.addPass(new OutputPass());
        composer.addPass(new SMAAPass());
        function resize() {
          const w = view.clientWidth,
            h = view.clientHeight;
          renderer.setSize(w, h, false);
          composer.setSize(w, h);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
        new ResizeObserver(resize).observe(view);
        resize();
        const t0 = performance.now();
        let last = 0;
        renderer.setAnimationLoop((ts) => {
          const s = (ts - t0) / 1000,
            dt = Math.min(0.05, s - last);
          last = s;
          const c = s % CYCLE;
          target.flicker = 0;
          tick(s, c, dt);
          const f = doStrike ? doStrike(s, dt) : 0;
          // cap: heat decays over the cycle, flash on contact, flicker from the state
          const heat = doStrike ? Math.max(0, 1 - c / 20) : 0;
          const capMul = 1.3 + heat * 5 * (1 + (target.flicker ?? 0)) + f * 4;
          target.cap.material.color.copy(AGENT).multiplyScalar(Math.max(0.9, capMul));
          if (!doStrike) target.cap.material.color.copy(AGENT).multiplyScalar(1.3);
          core.scale.setScalar((1 + 0.08 * Math.sin(s * 2.5)) * (1 + 1.6 * f));
          light.intensity = 8 * (1 + 2.5 * f);
          spot.material.opacity = 0.3 + 0.5 * f;
          composer.render();
        });
      }
      options.forEach(build);
    </script>
  </body>
</html>
