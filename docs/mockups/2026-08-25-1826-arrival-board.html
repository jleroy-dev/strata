<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Strata arrival board: how an agent arrives, waits and leaves</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #101216;
        color: #c9d1e0;
        font:
          13px/1.45 ui-monospace,
          Menlo,
          monospace;
        padding: 20px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 14px;
        color: #dfe6f5;
        font-weight: 600;
      }
      h1 small {
        color: #7c879f;
        font-weight: 400;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 18px;
      }
      .card {
        background: #0b0d12;
        border: 1px solid #1c2130;
        border-radius: 4px;
        overflow: hidden;
      }
      .card h2 {
        font-size: 11px;
        margin: 0;
        padding: 9px 11px;
        color: #dfe6f5;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        border-bottom: 1px solid #1c2130;
        display: flex;
        justify-content: space-between;
      }
      .card h2 .rec {
        color: #b8e6a8;
        text-transform: none;
        letter-spacing: 0;
      }
      .view {
        aspect-ratio: 1.3 / 1;
        position: relative;
      }
      .view canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .row {
        position: absolute;
        right: 8px;
        top: 8px;
        padding: 3px 8px;
        border-radius: 3px;
        font-size: 10.5px;
        display: flex;
        gap: 7px;
        align-items: center;
        background: rgba(6, 8, 12, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition:
          opacity 0.3s,
          transform 0.3s;
      }
      .row.off {
        opacity: 0;
        transform: translateX(12px);
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 6px currentColor;
      }
      .notes {
        padding: 10px 11px 12px;
        color: #9aa5bd;
        font-size: 11.5px;
      }
      .notes b {
        color: #dfe6f5;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>
      Arrival <small>(SessionStart: no block touched yet; each card replays every 4 s)</small>
    </h1>
    <div class="board" id="arrive"></div>
    <h1>
      Waiting and departure
      <small>(Stop is "finished the turn, waiting for you"; SessionEnd is departure)</small>
    </h1>
    <div class="board" id="leave"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
      import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
      import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
      import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
      import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

      const hsl = (h, s, l) => new THREE.Color().setHSL(h / 360, s, l);
      const AGENT = hsl(42, 1, 0.6);
      const add = (color, mult, opacity = 1) =>
        new THREE.MeshBasicMaterial({
          color: color.clone().multiplyScalar(mult),
          transparent: true,
          opacity,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide,
          toneMapped: false,
        });
      const easeOut = (k) => 1 - Math.pow(1 - k, 3),
        easeIn = (k) => k * k * k;
      const clamp01 = (v) => Math.max(0, Math.min(1, v));
      const U = 1.15,
        CYCLE = 4;
      const towersSpec = [
        [0, 0, 2.2],
        [1, 0, 1.4],
        [-1, 0, 2.1],
        [0, 1, 1.1],
        [0, -1, 1.8],
        [1, 1, 0.9],
        [-1, -1, 1.5],
        [1, -1, 2.4],
        [-1, 1, 1.0],
        [2, 0, 1.3],
        [-2, 0, 1.7],
        [2, 1, 0.8],
        [-2, -1, 1.2],
        [2, -1, 1.0],
        [-2, 1, 1.4],
      ];

      // shared beacon; each option drives it from a cycle phase c in [0, CYCLE)
      function beacon(sc, y) {
        const core = new THREE.Mesh(
          new THREE.SphereGeometry(0.1, 12, 12),
          new THREE.MeshBasicMaterial({
            color: AGENT.clone().multiplyScalar(18),
            toneMapped: false,
          }),
        );
        core.position.y = y;
        sc.add(core);
        const haloTex = (() => {
          const c = document.createElement('canvas');
          c.width = c.height = 64;
          const g = c.getContext('2d');
          const rg = g.createRadialGradient(32, 32, 1, 32, 32, 30);
          rg.addColorStop(0, 'rgba(255,255,255,1)');
          rg.addColorStop(0.18, 'rgba(255,255,255,.9)');
          rg.addColorStop(0.45, 'rgba(255,255,255,.18)');
          rg.addColorStop(1, 'rgba(255,255,255,0)');
          g.fillStyle = rg;
          g.fillRect(0, 0, 64, 64);
          return new THREE.CanvasTexture(c);
        })();
        const halo = new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: haloTex,
            color: AGENT.clone().multiplyScalar(3),
            sizeAttenuation: false,
            depthTest: false,
            transparent: true,
            toneMapped: false,
            blending: THREE.AdditiveBlending,
          }),
        );
        halo.scale.setScalar(0.018);
        sc.add(halo);
        const line = new THREE.Mesh(
          new THREE.CylinderGeometry(0.02, 0.02, 1, 6),
          add(AGENT, 2, 0.6),
        );
        sc.add(line);
        const light = new THREE.PointLight(AGENT, 8, 8, 1.7);
        sc.add(light);
        const ringTex = (() => {
          const c = document.createElement('canvas');
          c.width = c.height = 64;
          const g = c.getContext('2d');
          g.strokeStyle = '#fff';
          g.lineWidth = 3;
          g.beginPath();
          g.arc(32, 32, 28, 0, 7);
          g.stroke();
          return new THREE.CanvasTexture(c);
        })();
        const ping = new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: ringTex,
            color: AGENT.clone().multiplyScalar(2),
            sizeAttenuation: false,
            depthTest: false,
            transparent: true,
            opacity: 0,
            toneMapped: false,
            blending: THREE.AdditiveBlending,
          }),
        );
        sc.add(ping);
        const b = { core, halo, line, light, ping, restY: y };
        b.set = (y, scale, haloK, lineFrom, lineTo, lightK) => {
          core.position.y = y;
          core.scale.setScalar(scale);
          halo.position.y = y;
          halo.scale.setScalar(0.018 * haloK);
          halo.material.opacity = haloK > 0 ? 1 : 0;
          core.visible = scale > 0.001;
          const len = Math.max(0.001, Math.abs(lineTo - lineFrom));
          line.visible = len > 0.01;
          line.position.y = (lineFrom + lineTo) / 2;
          line.scale.y = len;
          light.position.y = y;
          light.intensity = 8 * lightK;
        };
        b.pingAt = (y, k) => {
          ping.position.y = y;
          ping.scale.setScalar(0.02 + 0.12 * Math.min(1, k));
          ping.material.opacity = k >= 0 && k < 1 ? (1 - k) * 0.9 : 0;
        };
        return b;
      }
      const breathe = (s) => 1 + 0.08 * Math.sin(s * 2.5);
      const SKY = 14;

      const arrivals = [
        {
          key: 'A1',
          title: 'Beam-in from above',
          rec: 'recommended',
          verbs: ['', 'idle', 'idle', 'idle'],
          notes:
            '<b>A line of light descends from the sky</b> over the map centre; the core ignites at its end with a ping and the halo blooms. The agent hovers there until its first event, then drops to the streets and travels. Honest: it has not touched anything yet, so it arrives above the map, not on it.',
          tick: (b, c, s, t) => {
            const y = t.hover;
            if (c < 0.7) {
              const k = easeOut(c / 0.7);
              const head = SKY - (SKY - y) * k;
              b.set(head, 0.001 + 0.9 * k, 0, SKY - (SKY - y) * clamp01(k * 1.15), head, k * 0.6);
              b.pingAt(y, -1);
            } else {
              const k = (c - 0.7) / 0.5;
              b.set(y, breathe(s), Math.min(1, k * 2), y, y, 1);
              b.pingAt(y, k);
            }
          },
        },
        {
          key: 'A2',
          title: 'Drop onto first block',
          rec: '',
          verbs: ['', 'reading', 'reading', 'reading'],
          notes:
            '<b>Nothing until the first event</b>, then the beacon drops straight onto that block and the landing strike plays. Cleanest, but a session that has started and not yet acted is invisible, and the roster row appears with no beacon to match it.',
          tick: (b, c, s, t) => {
            const y = t.cap + 1.2;
            if (c < 0.9) {
              b.set(0, 0.001, 0, 0, 0, 0);
              b.pingAt(y, -1);
            } else if (c < 1.3) {
              const k = easeIn((c - 0.9) / 0.4);
              const head = SKY - (SKY - y) * k;
              b.set(head, 0.9, 0.3, head + 2 * (1 - k), head, 0.6);
              b.pingAt(y, -1);
            } else {
              const k = (c - 1.3) / 0.5;
              b.set(
                y,
                breathe(s) * (1 + 1.6 * Math.exp(-k * 6)),
                1,
                t.cap,
                y,
                1 + 2.5 * Math.exp(-k * 6),
              );
              b.pingAt(y, k);
            }
          },
        },
        {
          key: 'A3',
          title: 'Rise from the plate',
          rec: '',
          verbs: ['', 'idle', 'idle', 'idle'],
          notes:
            '<b>The core emerges from the ground</b> at the map centre and climbs to hover height. Reads as "the repo produced an agent", which is backwards: agents come to the terrain, they are not part of it.',
          tick: (b, c, s, t) => {
            const y = t.hover;
            if (c < 0.8) {
              const k = easeOut(c / 0.8);
              const head = -0.2 + (y + 0.2) * k;
              b.set(head, 0.001 + 0.9 * k, k, 0.25, head, k);
              b.pingAt(y, -1);
            } else {
              b.set(y, breathe(s), 1, 0.25, y, 1);
              b.pingAt(y, (c - 0.8) / 0.5);
            }
          },
        },
        {
          key: 'A4',
          title: 'Fade in, in place',
          rec: '',
          verbs: ['', 'idle', 'idle', 'idle'],
          notes:
            '<b>The beacon simply fades up</b> at hover height over the map centre. Cheapest, and it is what most dashboards do. No direction, so nothing says "arrived": it reads as a rendering glitch resolving.',
          tick: (b, c, s, t) => {
            const y = t.hover;
            const k = clamp01(c / 0.8);
            b.set(y, breathe(s) * k, k, 0.25, y, k);
            b.line.material.opacity = 0.6 * k;
            b.pingAt(y, -1);
          },
        },
      ];
      const leaves = [
        {
          key: 'W',
          title: 'Waiting (Stop)',
          rec: 'the quiet state',
          verbs: ['editing', 'waiting', 'waiting', 'waiting'],
          notes:
            '<b>The turn is over and the next move is yours.</b> The beacon stays on its last block, the halo dims to half, the breathe slows, cap dark, no loop. The one sound cue plays here, if enabled. Idle (20 s timeout) looks the same and differs only in the roster word.',
          tick: (b, c, s, t) => {
            const y = t.cap + 1.2;
            const k = clamp01((c - 1) / 0.6);
            b.set(y, 1 + 0.08 * Math.sin(s * (2.5 - 1.3 * k)), 1 - 0.5 * k, t.cap, y, 1 - 0.4 * k);
            b.pingAt(y, -1);
          },
        },
        {
          key: 'L1',
          title: 'Derez upward',
          rec: 'recommended',
          verbs: ['waiting', 'waiting', 'done', ''],
          notes:
            '<b>The reverse of the beam-in.</b> The halo tightens into the core, the core rises along a fading line and is gone. Trace stays on the map, the ribbon finishes fading on its own clock, the roster row reads done then drops. Nothing else reacts.',
          tick: (b, c, s, t) => {
            const y = t.cap + 1.2;
            if (c < 1.5) {
              b.set(y, breathe(s), 0.5, t.cap, y, 0.6);
            } else if (c < 2.3) {
              const k = easeIn((c - 1.5) / 0.8);
              const head = y + (SKY - y) * k;
              b.set(
                head,
                0.9 * (1 - k * 0.6),
                0.5 * (1 - Math.min(1, k * 3)),
                y + (SKY - y) * clamp01(k * 1.3 - 0.3),
                head,
                0.6 * (1 - k),
              );
            } else b.set(0, 0.001, 0, 0, 0, 0);
            b.pingAt(y, -1);
          },
        },
        {
          key: 'L2',
          title: 'Sink into the block',
          rec: '',
          verbs: ['waiting', 'waiting', 'done', ''],
          notes:
            '<b>The beacon descends into the tower and goes out.</b> Reads as "absorbed by the file", which is the wrong story: the agent leaves the repo, it does not become part of it.',
          tick: (b, c, s, t) => {
            const y = t.cap + 1.2;
            if (c < 1.5) {
              b.set(y, breathe(s), 0.5, t.cap, y, 0.6);
            } else if (c < 2.3) {
              const k = easeIn((c - 1.5) / 0.8);
              const head = y - (y - t.cap + 0.1) * k;
              b.set(head, 0.9 * (1 - k), 0.5 * (1 - k), t.cap, head, 0.6 * (1 - k));
            } else b.set(0, 0.001, 0, 0, 0, 0);
            b.pingAt(y, -1);
          },
        },
        {
          key: 'L3',
          title: 'Dissolve in place',
          rec: '',
          verbs: ['waiting', 'waiting', 'done', ''],
          notes:
            '<b>The beacon fades out where it is.</b> Symmetric with A4 and has the same flaw: nothing says "left". Also indistinguishable from a beacon going dim for waiting, which is a state we need to keep distinct.',
          tick: (b, c, s, t) => {
            const y = t.cap + 1.2;
            const k = c < 1.5 ? 0 : clamp01((c - 1.5) / 0.8);
            b.set(y, breathe(s) * (1 - k), 0.5 * (1 - k), t.cap, y, 0.6 * (1 - k));
            b.line.material.opacity = 0.6 * (1 - k);
            b.pingAt(y, -1);
          },
        },
      ];

      function build(opt, holder) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h2><span>${opt.key} · ${opt.title}</span><span class="rec">${opt.rec}</span></h2><div class="view"><canvas></canvas><div class="row" style="color:hsl(42,90%,62%)"><span class="dot"></span><span style="color:#ddd">claude 7f3a</span><span class="verb" style="color:#b5bed2"></span></div></div><div class="notes">${opt.notes}</div>`;
        document.getElementById(holder).appendChild(card);
        const canvas = card.querySelector('canvas'),
          view = card.querySelector('.view'),
          row = card.querySelector('.row'),
          verbEl = card.querySelector('.verb');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.AgXToneMapping;
        renderer.toneMappingExposure = 0.85;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.VSMShadowMap;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2d2f38);
        const camera = new THREE.PerspectiveCamera(30, 1.3, 0.1, 100);
        const ELEV = THREE.MathUtils.degToRad(38),
          YAW = THREE.MathUtils.degToRad(28);
        camera.position
          .set(Math.cos(ELEV) * Math.sin(YAW), Math.sin(ELEV), Math.cos(ELEV) * Math.cos(YAW))
          .multiplyScalar(19);
        camera.lookAt(0, 2.2, 0);
        scene.add(new THREE.HemisphereLight(0xb9c4d8, 0x4a3f38, 0.8));
        const k = new THREE.DirectionalLight(0xffd9b0, 1.7);
        k.position.set(-8, 9, 6);
        k.castShadow = true;
        k.shadow.mapSize.set(1024, 1024);
        k.shadow.radius = 5;
        k.shadow.bias = -0.0004;
        const c = k.shadow.camera;
        c.left = c.bottom = -8;
        c.right = c.top = 8;
        c.far = 40;
        scene.add(k);
        const r = new THREE.DirectionalLight(0x8fb0ff, 0.5);
        r.position.set(6, 4, -5);
        scene.add(r);
        const std = (color) =>
          new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.05 });
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), std(hsl(228, 0.08, 0.24)));
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.3;
        ground.receiveShadow = true;
        scene.add(ground);
        const plat = new THREE.Mesh(
          new THREE.BoxGeometry(5.6 * U, 0.25, 3.6 * U),
          std(hsl(212, 0.22, 0.36)),
        );
        plat.position.y = 0.12;
        plat.receiveShadow = plat.castShadow = true;
        scene.add(plat);
        const tg = new THREE.BoxGeometry(0.8, 1, 0.8);
        tg.translate(0, 0.5, 0);
        const target = {
          cap: 0.25 + towersSpec[0][2] + 0.03,
          hover: 0.25 + 2.2 + 0.3 + 0.95 * 1.4,
        };
        towersSpec.forEach(([x, z, h]) => {
          const m = new THREE.Mesh(tg, std(hsl(212, 0.26, 0.5)));
          m.position.set(x * U, 0.25, z * U);
          m.scale.y = h;
          m.castShadow = m.receiveShadow = true;
          scene.add(m);
          const cap = new THREE.Mesh(
            new THREE.BoxGeometry(0.84, 0.06, 0.84),
            new THREE.MeshBasicMaterial({ color: hsl(212, 0.45, 0.58), toneMapped: false }),
          );
          cap.position.set(x * U, 0.25 + h, z * U);
          scene.add(cap);
        });
        const b = beacon(scene, target.cap + 1.2);
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(400, 300), 0.5, 0.3, 1.0));
        composer.addPass(new OutputPass());
        composer.addPass(new SMAAPass());
        function resize() {
          const w = view.clientWidth,
            h = view.clientHeight;
          renderer.setSize(w, h, false);
          composer.setSize(w, h);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
        new ResizeObserver(resize).observe(view);
        resize();
        const t0 = performance.now();
        renderer.setAnimationLoop((ts) => {
          const s = (ts - t0) / 1000,
            cyc = s % CYCLE;
          b.line.material.opacity = 0.6;
          opt.tick(b, cyc, s, target);
          const verb = opt.verbs[Math.min(3, Math.floor(cyc))];
          verbEl.textContent = verb;
          row.classList.toggle('off', !verb);
          composer.render();
        });
      }
      arrivals.forEach((o) => build(o, 'arrive'));
      leaves.forEach((o) => build(o, 'leave'));
    </script>
  </body>
</html>
