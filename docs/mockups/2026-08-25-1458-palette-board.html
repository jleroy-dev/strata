<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Strata palette board: A night neon, B hologram, C matte dusk</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #101216;
        color: #c9d1e0;
        font:
          13px/1.45 ui-monospace,
          Menlo,
          monospace;
        padding: 20px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 14px;
        color: #dfe6f5;
        font-weight: 600;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
      .card {
        background: #0b0d12;
        border: 1px solid #1c2130;
        border-radius: 4px;
        overflow: hidden;
      }
      .card h2 {
        font-size: 12px;
        margin: 0;
        padding: 10px 12px;
        color: #dfe6f5;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        border-bottom: 1px solid #1c2130;
        display: flex;
        justify-content: space-between;
      }
      .card h2 .rec {
        color: #b8e6a8;
        text-transform: none;
        letter-spacing: 0;
      }
      .view {
        position: relative;
        aspect-ratio: 4 / 3.2;
      }
      .view canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .scan {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(transparent 0 2px, rgba(0, 0, 0, 0.18) 2px 3px);
        mix-blend-mode: multiply;
      }
      .vig {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.4) 100%);
      }
      .swatches {
        padding: 10px 12px 12px;
        display: grid;
        gap: 6px;
      }
      .tier {
        display: grid;
        grid-template-columns: 96px 1fr;
        align-items: center;
        gap: 8px;
        font-size: 10.5px;
        color: #6b7690;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .chips {
        display: flex;
        gap: 4px;
      }
      .chip {
        height: 18px;
        flex: 1;
        border-radius: 2px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .notes {
        padding: 0 12px 12px;
        color: #9aa5bd;
        font-size: 12px;
      }
      .notes b {
        color: #dfe6f5;
        font-weight: 600;
      }
      .hud {
        position: absolute;
        left: 10px;
        top: 8px;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
      }
      .row {
        position: absolute;
        right: 8px;
        top: 8px;
        padding: 3px 8px;
        border-radius: 3px;
        font-size: 10.5px;
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 6px currentColor;
      }
    </style>
  </head>
  <body>
    <h1>
      Palette board: the same district under three directions. Weather (beacon, trail, heat, pulse,
      contest) is the only thing allowed to bloom in all three.
    </h1>
    <div class="board" id="board"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
      import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
      import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
      import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
      import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

      // ---------- one small map, shared ----------
      let seed = 5;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const U = 1.15;
      const countries = [
        {
          name: 'packages/core',
          slot: 0,
          ox: 0,
          oz: 0,
          districts: [
            { x: 0, z: 0, w: 4, h: 3 },
            { x: 5, z: 0, w: 3, h: 2 },
            { x: 0, z: 4, w: 3, h: 2 },
          ],
        },
        {
          name: 'packages/web',
          slot: 1,
          ox: 12,
          oz: 0,
          districts: [
            { x: 0, z: 0, w: 3, h: 3 },
            { x: 4, z: 0, w: 4, h: 2 },
            { x: 0, z: 4, w: 5, h: 2 },
          ],
        },
        { name: 'docs', slot: 2, ox: 0, oz: 9, districts: [{ x: 0, z: 0, w: 3, h: 2 }] },
        {
          name: 'packages/server',
          slot: 3,
          ox: 12,
          oz: 9,
          districts: [
            { x: 0, z: 0, w: 4, h: 2 },
            { x: 5, z: 0, w: 3, h: 2 },
          ],
        },
      ];
      const blocks = [];
      countries.forEach((c) => {
        c.w = Math.max(...c.districts.map((d) => d.x + d.w));
        c.h = Math.max(...c.districts.map((d) => d.z + d.h));
        c.districts.forEach((d) => {
          d.country = c;
          for (let i = 0; i < d.w * d.h; i++)
            if (rnd() < 0.85)
              blocks.push({
                gx: c.ox + d.x + (i % d.w),
                gz: c.oz + d.z + Math.floor(i / d.w),
                hgt: 0.4 + rnd() * rnd() * 3.2,
                country: c,
                district: d,
              });
        });
      });
      const TW = 21,
        TH = 12;
      const wx = (g) => (g - TW / 2) * U,
        wz = (g) => (g - TH / 2) * U;
      blocks.forEach((b) => {
        b.x = wx(b.gx + 0.5);
        b.z = wz(b.gz + 0.5);
      });
      const hot = blocks[7],
        hot2 = blocks[9],
        contested = blocks[23],
        agentBlock = blocks[15];
      const trailPath = [blocks[30], blocks[31]].map(
        (b) => new THREE.Vector3(b.x, b.hgt + 0.3, b.z),
      );
      trailPath.splice(
        1,
        0,
        new THREE.Vector3(wx(countries[1].ox - 1.5), 0.3, wz(4)),
        new THREE.Vector3(wx(countries[1].ox - 1.5), 0.3, wz(9.5)),
        new THREE.Vector3(blocks[31].x, 0.3, wz(9.5)),
      );

      // ---------- the three directions ----------
      const hsl = (h, s, l) => new THREE.Color().setHSL(h / 360, s, l);
      const directions = [
        {
          key: 'A',
          title: 'Night neon, refined',
          rec: '',
          bg: 0x0d1220,
          fog: 0.02,
          exposure: 0.95,
          tone: THREE.AgXToneMapping,
          shadows: false,
          ground: hsl(225, 0.25, 0.1),
          plate: (s) => hsl(ACC[s], 0.3, 0.13),
          platform: (s) => hsl(ACC[s], 0.35, 0.18),
          tower: (s) => hsl(ACC[s], 0.35, 0.34),
          cap: (s) => hsl(ACC[s], 0.7, 0.45),
          lights: (sc) => {
            sc.add(new THREE.HemisphereLight(0x6f8fd0, 0x120c08, 0.9));
            const k = new THREE.DirectionalLight(0xffd6a8, 1.1);
            k.position.set(-14, 22, 8);
            sc.add(k);
            const r = new THREE.DirectionalLight(0x6fa0ff, 0.5);
            r.position.set(12, 10, -14);
            sc.add(r);
          },
          agent: hsl(42, 1, 0.6),
          agent2: hsl(325, 1, 0.6),
          contest: 0xffffff,
          bloom: [0.55, 0.35, 1.0],
          material: 'standard',
          roughness: 0.6,
          notes:
            '<b>Navy lifted to a midtone</b>, warm key and cool rim so faces differ. Caps carry the country hue at rest but stay under the bloom threshold. Still a dark panel beside a dark terminal.',
        },
        {
          key: 'B',
          title: 'Hologram war table',
          rec: '',
          bg: 0x030a0e,
          fog: 0.0,
          exposure: 1.0,
          tone: THREE.AgXToneMapping,
          shadows: false,
          scan: true,
          ground: hsl(190, 0.5, 0.05),
          plate: (s) => hsl(178 + s * 8, 0.6, 0.14),
          platform: (s) => hsl(178 + s * 8, 0.6, 0.2),
          tower: (s) => hsl(178 + s * 8, 0.55, 0.32),
          cap: (s) => hsl(178 + s * 8, 0.8, 0.55),
          lights: (sc) => {
            sc.add(new THREE.HemisphereLight(0x9fe8ff, 0x021015, 1.4));
          },
          agent: hsl(28, 1, 0.58),
          agent2: hsl(315, 1, 0.62),
          contest: 0xffffff,
          bloom: [0.7, 0.4, 0.9],
          material: 'holo',
          roughness: 1,
          notes:
            '<b>One teal family, additive, translucent</b>, edges drawn. Agents in warm complements pop hard. Countries are only a hue shift of teal: ownership is the weakest read of the three. Scanlines are a gimmick and would go.',
        },
        {
          key: 'C',
          title: 'Matte dusk',
          rec: 'recommended',
          bg: 0x2d2f38,
          fog: 0.012,
          exposure: 0.85,
          tone: THREE.AgXToneMapping,
          shadows: true,
          ground: hsl(228, 0.08, 0.24),
          plate: (s) => hsl(ACC[s], 0.18, 0.3),
          platform: (s) => hsl(ACC[s], 0.22, 0.36),
          tower: (s) => hsl(ACC[s], 0.26, 0.5),
          cap: (s) => hsl(ACC[s], 0.45, 0.58),
          lights: (sc) => {
            sc.add(new THREE.HemisphereLight(0xb9c4d8, 0x4a3f38, 0.8));
            const k = new THREE.DirectionalLight(0xffd9b0, 1.7);
            k.position.set(-16, 14, 10);
            k.castShadow = true;
            k.shadow.mapSize.set(2048, 2048);
            k.shadow.radius = 6;
            k.shadow.bias = -0.0005;
            const c = k.shadow.camera;
            c.left = c.bottom = -18;
            c.right = c.top = 18;
            c.far = 80;
            sc.add(k);
            const r = new THREE.DirectionalLight(0x8fb0ff, 0.5);
            r.position.set(14, 8, -12);
            sc.add(r);
          },
          agent: hsl(42, 1, 0.58),
          agent2: hsl(325, 1, 0.58),
          contest: 0xffffff,
          bloom: [0.5, 0.3, 1.0],
          material: 'standard',
          roughness: 0.85,
          notes:
            '<b>Slate at 25 to 30% luminance</b>, low saturation at any brightness, soft shadows give form. Country tints are muted on plates and caps. Weather is the only saturated, only HDR thing on screen, so a glow has contrast both ways.',
        },
      ];
      const ACC = [212, 28, 95, 160, 280, 350]; // fixed country accent ramp, agent slots sit in its gaps

      // ---------- build one card ----------
      function build(dir) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h2><span>${dir.key} · ${dir.title}</span><span class="rec">${dir.rec}</span></h2><div class="view"><canvas></canvas>${dir.scan ? '<div class="scan"></div>' : ''}<div class="vig"></div><div class="hud">camera <span style="color:#fff">Overview</span></div><div class="row" style="color:#${dir.agent.getHexString()};background:rgba(0,0,0,.35)"><span class="dot"></span><span style="color:#ddd">claude 7f3a</span><span style="color:#999">editing</span></div></div><div class="swatches"></div><div class="notes">${dir.notes}</div>`;
        document.getElementById('board').appendChild(card);
        const sw = card.querySelector('.swatches');
        const tier = (label, cols) => {
          const t = document.createElement('div');
          t.className = 'tier';
          t.innerHTML = `<span>${label}</span><div class="chips">${cols.map((c) => `<div class="chip" style="background:#${c.getHexString()}"></div>`).join('')}</div>`;
          sw.appendChild(t);
        };
        tier('environment', [new THREE.Color(dir.bg), dir.ground, dir.platform(0), dir.tower(0)]);
        tier(
          'accents',
          ACC.map((_, i) => dir.cap(i)),
        );
        tier('weather', [dir.agent, dir.agent2, hsl(190, 1, 0.6), new THREE.Color(dir.contest)]);

        const canvas = card.querySelector('canvas');
        const view = card.querySelector('.view');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = dir.tone;
        renderer.toneMappingExposure = dir.exposure;
        renderer.shadowMap.enabled = dir.shadows;
        renderer.shadowMap.type = THREE.VSMShadowMap;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(dir.bg);
        if (dir.fog) scene.fog = new THREE.FogExp2(dir.bg, dir.fog);
        const camera = new THREE.PerspectiveCamera(30, 4 / 3.2, 0.1, 200);
        const ELEV = THREE.MathUtils.degToRad(38),
          YAW = THREE.MathUtils.degToRad(28);
        camera.position
          .set(Math.cos(ELEV) * Math.sin(YAW), Math.sin(ELEV), Math.cos(ELEV) * Math.cos(YAW))
          .multiplyScalar(44);
        camera.lookAt(0, 0.5, 0);
        dir.lights(scene);
        const mat = (color, extra = {}) =>
          dir.material === 'holo'
            ? new THREE.MeshBasicMaterial({
                color,
                transparent: true,
                opacity: 0.55,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                ...extra,
              })
            : new THREE.MeshStandardMaterial({
                color,
                roughness: dir.roughness,
                metalness: 0.05,
                ...extra,
              });
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), mat(dir.ground));
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.3;
        ground.receiveShadow = true;
        scene.add(ground);
        const edge = (geo, color, op) => {
          const l = new THREE.LineSegments(
            new THREE.EdgesGeometry(geo),
            new THREE.LineBasicMaterial({ color, transparent: true, opacity: op }),
          );
          return l;
        };
        countries.forEach((c) => {
          const w = (c.w + 1.6) * U,
            d = (c.h + 1.6) * U,
            x = wx(c.ox + c.w / 2),
            z = wz(c.oz + c.h / 2);
          const g = new THREE.BoxGeometry(w, 0.3, d);
          const plate = new THREE.Mesh(g, mat(dir.plate(c.slot)));
          plate.position.set(x, -0.15, z);
          plate.receiveShadow = plate.castShadow = true;
          scene.add(plate);
          if (dir.material === 'holo') {
            const e = edge(g, dir.cap(c.slot), 0.7);
            e.position.copy(plate.position);
            scene.add(e);
          } else {
            const e = edge(
              new THREE.BoxGeometry(w, 0.02, d),
              dir.cap(c.slot),
              dir.key === 'C' ? 0.35 : 0.5,
            );
            e.position.set(x, 0.01, z);
            scene.add(e);
          }
          c.districts.forEach((dd) => {
            const pw = (dd.w + 0.6) * U,
              pd = (dd.h + 0.6) * U;
            const pg = new THREE.BoxGeometry(pw, 0.25, pd);
            const p = new THREE.Mesh(pg, mat(dir.platform(c.slot)));
            p.position.set(wx(c.ox + dd.x + dd.w / 2), 0.12, wz(c.oz + dd.z + dd.h / 2));
            p.receiveShadow = p.castShadow = true;
            scene.add(p);
            if (dir.material === 'holo') {
              const e = edge(pg, dir.cap(c.slot), 0.35);
              e.position.copy(p.position);
              scene.add(e);
            }
          });
        });
        const tg = new THREE.BoxGeometry(0.8, 1, 0.8);
        tg.translate(0, 0.5, 0);
        blocks.forEach((b) => {
          const t = new THREE.Mesh(tg, mat(dir.tower(b.country.slot)));
          t.position.set(b.x, 0.25, b.z);
          t.scale.y = b.hgt;
          t.castShadow = t.receiveShadow = true;
          scene.add(t);
          if (dir.material === 'holo') {
            const e = edge(tg, dir.cap(b.country.slot), 0.5);
            e.position.copy(t.position);
            e.scale.copy(t.scale);
            scene.add(e);
          }
          // cap: country tint at rest, HDR agent colour when hot
          const heat = b === hot ? 1 : b === hot2 ? 0.5 : 0;
          const capCol = heat
            ? dir.agent.clone().multiplyScalar(1 + heat * 5)
            : dir.cap(b.country.slot);
          const cap = new THREE.Mesh(
            new THREE.BoxGeometry(0.84, 0.06, 0.84),
            new THREE.MeshBasicMaterial({ color: capCol, toneMapped: false }),
          );
          cap.position.set(b.x, 0.25 + b.hgt, b.z);
          scene.add(cap);
          if (heat) {
            t.material = t.material.clone();
            t.material.color.lerp(dir.agent, 0.35 * heat);
            if (dir.material !== 'holo')
              t.material.emissive = dir.agent.clone().multiplyScalar(0.25 * heat);
          }
          if (b === contested) {
            const rg = new THREE.RingGeometry(0.62, 0.72, 4, 1);
            rg.rotateX(-Math.PI / 2);
            rg.rotateY(Math.PI / 4);
            const r = new THREE.Mesh(
              rg,
              new THREE.MeshBasicMaterial({
                color: new THREE.Color(dir.contest).multiplyScalar(3),
                side: THREE.DoubleSide,
                toneMapped: false,
              }),
            );
            r.position.set(b.x, b.hgt + 0.32, b.z);
            scene.add(r);
            b.ring = r;
          }
        });
        // trail ribbon: HDR core fading along its length
        const pos = [],
          cols = [];
        for (let i = 0; i < trailPath.length - 1; i++) {
          const a = trailPath[i],
            b = trailPath[i + 1];
          const d = new THREE.Vector3().subVectors(b, a);
          const n = new THREE.Vector3(-d.z, 0, d.x).normalize().multiplyScalar(0.08);
          const p = [a.clone().add(n), a.clone().sub(n), b.clone().add(n), b.clone().sub(n)];
          p.forEach((v) => (v.y = 0.29));
          const k0 = i / (trailPath.length - 1),
            k1 = (i + 1) / (trailPath.length - 1);
          [
            [0, k0],
            [1, k0],
            [2, k1],
            [1, k0],
            [3, k1],
            [2, k1],
          ].forEach(([j, k]) => {
            pos.push(p[j].x, p[j].y, p[j].z);
            const c = dir.agent2.clone().multiplyScalar(0.3 + 12 * k * k);
            cols.push(c.r, c.g, c.b);
          });
        }
        const trailGeo = new THREE.BufferGeometry();
        trailGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        trailGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
        scene.add(
          new THREE.Mesh(
            trailGeo,
            new THREE.MeshBasicMaterial({
              vertexColors: true,
              transparent: true,
              blending: THREE.AdditiveBlending,
              depthWrite: false,
              side: THREE.DoubleSide,
              toneMapped: false,
            }),
          ),
        );
        // pulse in the fibre: head the width of the trail, very bright, at the end of the ribbon
        const head = new THREE.Mesh(
          new THREE.SphereGeometry(0.11, 12, 12),
          new THREE.MeshBasicMaterial({
            color: dir.agent2.clone().multiplyScalar(40),
            toneMapped: false,
          }),
        );
        head.position.copy(trailPath[trailPath.length - 1]);
        scene.add(head);
        const headLight = new THREE.PointLight(dir.agent2, 8, 5, 1.8);
        headLight.position.copy(head.position);
        scene.add(headLight);
        // beacon at rest on the agent's block: HDR core sprite + halo + point light spilling on neighbours
        const tex = (() => {
          const c = document.createElement('canvas');
          c.width = c.height = 64;
          const g = c.getContext('2d');
          const r = g.createRadialGradient(32, 32, 1, 32, 32, 30);
          r.addColorStop(0, 'rgba(255,255,255,1)');
          r.addColorStop(0.18, 'rgba(255,255,255,.9)');
          r.addColorStop(0.45, 'rgba(255,255,255,.18)');
          r.addColorStop(1, 'rgba(255,255,255,0)');
          g.fillStyle = r;
          g.fillRect(0, 0, 64, 64);
          return new THREE.CanvasTexture(c);
        })();
        const beacon = new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: tex,
            color: dir.agent.clone().multiplyScalar(12),
            sizeAttenuation: false,
            depthTest: false,
            transparent: true,
            toneMapped: false,
            blending: THREE.AdditiveBlending,
          }),
        );
        beacon.scale.setScalar(0.06);
        beacon.position.set(agentBlock.x, agentBlock.hgt + 1.5, agentBlock.z);
        scene.add(beacon);
        const core = new THREE.Mesh(
          new THREE.SphereGeometry(0.13, 12, 12),
          new THREE.MeshBasicMaterial({
            color: dir.agent.clone().multiplyScalar(30),
            toneMapped: false,
          }),
        );
        core.position.copy(beacon.position);
        scene.add(core);
        const stem = new THREE.Mesh(
          new THREE.CylinderGeometry(0.02, 0.02, 1.2, 6),
          new THREE.MeshBasicMaterial({
            color: dir.agent.clone().multiplyScalar(2),
            transparent: true,
            opacity: 0.6,
            toneMapped: false,
          }),
        );
        stem.position.copy(beacon.position).y -= 0.65;
        scene.add(stem);
        const light = new THREE.PointLight(dir.agent, 14, 8, 1.7);
        light.position.copy(beacon.position);
        scene.add(light);
        // edit pulse ring on the hot block
        const pg = new THREE.RingGeometry(0.5, 0.58, 48);
        pg.rotateX(-Math.PI / 2);
        const pulse = new THREE.Mesh(
          pg,
          new THREE.MeshBasicMaterial({
            color: dir.agent.clone().multiplyScalar(6),
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            toneMapped: false,
          }),
        );
        pulse.position.set(hot.x, 0.27, hot.z);
        scene.add(pulse);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloom = new UnrealBloomPass(
          new THREE.Vector2(800, 640),
          dir.bloom[0],
          dir.bloom[1],
          dir.bloom[2],
        );
        composer.addPass(bloom);
        composer.addPass(new OutputPass());
        composer.addPass(new SMAAPass());
        function resize() {
          const w = view.clientWidth,
            h = view.clientHeight;
          renderer.setSize(w, h, false);
          composer.setSize(w, h);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
        new ResizeObserver(resize).observe(view);
        resize();
        let t0 = performance.now();
        renderer.setAnimationLoop((ts) => {
          const t = (ts - t0) / 1000;
          beacon.scale.setScalar(0.06 * (1 + 0.1 * Math.sin(t * 2)));
          const k = (t % 1.6) / 1.6;
          pulse.scale.setScalar(1 + k * 3.5);
          pulse.material.opacity = 1 - k;
          if (contested.ring) contested.ring.rotation.y = t * 0.6;
          composer.render();
        });
      }
      directions.forEach(build);
    </script>
  </body>
</html>
